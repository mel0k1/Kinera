name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: kinera-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    env:
      KINERA_KEYSTORE_B64: ${{ secrets.KINERA_KEYSTORE_B64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode signing keystore
        if: env.KINERA_KEYSTORE_B64 != ''
        run: echo "${KINERA_KEYSTORE_B64}" | base64 -d > kinera-release.jks

      - name: Build signed release APK
        if: env.KINERA_KEYSTORE_B64 != ''
        env:
          KINERA_KEYSTORE_FILE: kinera-release.jks
          KINERA_KEYSTORE_PASSWORD: ${{ secrets.KINERA_KEYSTORE_PASSWORD }}
          KINERA_KEY_ALIAS: ${{ secrets.KINERA_KEY_ALIAS }}
          KINERA_KEY_PASSWORD: ${{ secrets.KINERA_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Rename release APK
        if: env.KINERA_KEYSTORE_B64 != ''
        run: mv app/build/outputs/apk/release/app-release.apk "Kinera-${GITHUB_REF_NAME}-release.apk"

      - name: Download debug APK
        uses: actions/download-artifact@v8
        with:
          name: kinera-debug-apk

      - name: Rename debug APK
        run: mv app-debug.apk "Kinera-${GITHUB_REF_NAME}-debug.apk" 2>/dev/null || mv **/app-debug.apk "Kinera-${GITHUB_REF_NAME}-debug.apk"

      - name: Attach APKs to release
        uses: softprops/action-gh-release@v2
        with:
          files: Kinera-*.apk
          overwrite_files: true
          prerelease: ${{ contains(github.ref_name, 'beta') }}
